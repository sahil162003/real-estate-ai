
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==================================
    # React Frontend
    # ==================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==================================
    # Main Spring Boot Backend
    # Docker service name: backend
    # Port: 8081
    # ==================================
    location /api/ {
        proxy_pass http://backend:8081;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React OAuth callback
    location = /oauth2/callback {
          try_files /index.html =404;
    }
    # ==================================
    # Google OAuth2
    # ==================================
    location /oauth2/ {
        proxy_pass http://backend:8081;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================================
    # Login / Authentication
    # ==================================
    location /login/ {
        proxy_pass http://backend:8081;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================================
    # Notification Service
    # Docker service name: notification
    # Port: 8083
    # ==================================
    location /notification-api/ {
        proxy_pass http://notification:8083/api/notifications/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket notifications
location /ws-notifications {
    proxy_pass http://notification:8083/ws-notifications;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
}
